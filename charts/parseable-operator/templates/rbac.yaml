# Rules are generated by controller-gen from the +kubebuilder:rbac markers
# (`make manifests` copies config/rbac/role.yaml into files/).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "parseable-operator.fullname" . }}
  labels:
    {{- include "parseable-operator.labels" . | nindent 4 }}
rules:
  {{- (.Files.Get "files/role.yaml" | fromYaml).rules | toYaml | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "parseable-operator.fullname" . }}
  labels:
    {{- include "parseable-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "parseable-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "parseable-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
